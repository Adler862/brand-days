# brand-days 生成配置
# 改这里不需要动代码。

# ─────────────────────────────────────────────────────────────
# 生成窗口：一次生成多少天的日历事件
# ─────────────────────────────────────────────────────────────
#
# 默认 365 天，比常见的 30 天长得多。原因在客户端的更新能力：
#
#   手机自带日历（尤其国产 ROM）通常【只能导入 ics，不能订阅 ics】，
#   数据不会自动更新，每次刷新都得手动重导一次。
#   而且导入时会丢弃事件的 UID，重复导入【不会去重，只会堆重复事件】。
#
#   结论：更新频率越低越好。
#   窗口 30 天  -> 一年要重导 12 次（每次都得先清理旧事件），不可接受
#   窗口 365 天 -> 一年处理 0~2 次（只在数据本身变化时才需要）
#
# 代价：文件更大（约 240 KB / 年），且"活动停办"这类变化要到下次重新生成
#       才会反映。对周期性优惠来说这个代价可以接受：疯四、每月 8 号会员日
#       这类规则本身就以年为单位稳定。
#
# 如果你用的是能自动拉取的订阅型客户端，把窗口改回 30 即可。
window_days: 365

# 日历起点。null = 从今天开始；也可写死日期便于复现，例如 2026-10-15
start_date: null

# 晚 nudges：每晚这个时刻提醒“明天有什么”。
# 这是主动通知的唯一来源，必须落在用户还醒着且能决策的时间。
remind_at: "20:00"

# 定时提醒事件的持续时长（分钟）。仅影响日历里那一条的显示长度。
nudge_duration_minutes: 20

# 是否生成“当天全天摘要”事件（兜底可见性：
# 万一手机不弹 VALARM 通知，翻日历仍能看到今天有什么）。
digest: true

# ─────────────────────────────────────────────────────────────
# 手机端日历
# ─────────────────────────────────────────────────────────────
#
# phone_calendar_name 是【手机上那个专属日历的显示名】。
# 强烈建议在手机日历里单独建一个日历（例如「优惠提醒」）再导入本项目的 ics，
# 否则事件会混进你的个人日程 —— 之后想清理旧事件时，
# 你只能在一堆自己的日程里逐条挑，那个摩擦会让人第三次就放弃。
#
# tools/refresh_on_phone.py 会清空【这个日历】里的所有事件再重新导入，
# 因此它必须和手机上实际存在的日历名一致。
phone_calendar_name: "优惠提醒"

# ics 里的日历显示名（订阅型客户端会用这个名字）
calendar_name: "品牌日提醒"
uid_domain: "brand-days"

# ics 对外访问地址。生成器会把它写进网页和 README。
# 走 jsDelivr 是因为 raw.githubusercontent.com 在国内多数网络不可达。
# 注意：jsDelivr 有约 12 小时缓存，改数据后不会立刻生效。
#
# ⚠️ 这个地址一旦对外发布，就成了所有订阅者日历里的地址。
#    更换 GitHub 用户名会导致所有订阅链接失效。
base_url: "https://cdn.jsdelivr.net/gh/Adler862/brand-days@main"

# 时区。中国自 1991 年起无夏令时，全年 +0800。
timezone: "Asia/Shanghai"

# VTIMEZONE 定义的覆盖年限。必须远大于 window_days 所能到达的年份，
# 否则远期事件会没有时区定义。365 天窗口下仍给到 2050 作为安全余量。
tz_last_year: 2050

# 各 tier 是否进入日历。
# core      = 我会为它改变行为，进日历
# extended  = 留在数据和网页里，不进日历（避免噪音导致整个日历被静音）
tiers_in_calendar:
  - core

outputs:
  ics: "deals.ics"
  html: "index.html"

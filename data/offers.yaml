# brand-days 核心数据：周期性优惠
#
# 字段说明：
#   id          稳定标识，改名会导致日历里出现重复事件，尽量别动
#   brand       品牌名
#   offer       优惠内容（会显示在日历标题里，写短）
#   recur       周期规则
#                 weekly  -> days: [mon, tue, ...]
#                 monthly -> days: [8]  （每月几号）
#   window      可选，一天内的时段。绑时段的优惠必须写，否则日历提醒时刻会错
#   start       可选，规则生效起始日。留空表示很久以前就已生效
#   tier        core     = 进日历（我会为它改变行为）
#               extended = 只留在数据和网页里，不进日历
#   confidence  verified | unverified（unverified 一律不进日历）
#   conditions  前提条件/限制，务必如实写，否则用户白跑一趟
#   source      哪看到的（URL 或“官方小程序”）
#   verified_at 上次本人确认的日期。超过 90 天会被 update 脚本提示复核
#   notes       备注


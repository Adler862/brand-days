# brand-days 待核实区
#
# 这里的条目【不会】生成日历事件，也不会出现在“已确认”列表里。
# 它们是从微信素材收集来、但本轮网上核查【未找到可靠来源】或【与素材不符】的条目。
#
# 用途有两个：
#   1. 保留线索，不因为“查不到”就丢掉信息
#   2. 作为一份待办清单 —— 你在线下（真的去了那家店）或小程序里确认后，
#      把该条移到 ../offers.yaml 并把 confidence 改成 verified
#
# 字段：
#   candidate_day  素材里声称的周期（未经证实，仅作线索）
#   reason         为什么没进 offers.yaml
